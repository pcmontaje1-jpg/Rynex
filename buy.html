<!DOCTYPE html>
<html>
<head>
    <title>Buy PC</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial;

            /* чёрный центр + белые края */
            background: radial-gradient(circle, #000 40%, #fff 100%);
        }

        .form-box {
            background: #111;
            padding: 30px;

            border-radius: 15px;

            width: 300px;
            text-align: center;

            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        h2 {
            color: white;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;

            border-radius: 8px;
            border: none;

            background: #222;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;

            background: #777;
            color: white;

            border: none;
            border-radius: 10px;

            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #999;
        }

        p {
            color: #ccc;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>Order Your PC</h2>

    <p>Fill the form and your email will open to send the request.</p>

    <form action="mailto:pcmontaje1@gmail.com" method="post" enctype="text/plain">

        <input type="text" name="name" placeholder="Your Name" required>

        <input type="email" name="email" placeholder="Your Email" required>

        <input type="text" name="budget" placeholder="Budget (€)" required>

        <select name="type">
            <option>Gaming</option>
            <option>Work</option>
        </select>

        <textarea name="message" placeholder="Message"></textarea>

        <button type="submit">SEND</button>

    </form>
</div>

</body>
</html>
