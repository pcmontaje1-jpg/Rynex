<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rynex Builder</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;

            /* ТОТ ЖЕ ФОН */
            background: radial-gradient(circle at center, #000000 0%, #0a0a0a 40%, #ffffff 100%);

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .value {
            margin-top: 15px;
            font-size: 20px;
        }

        input[type="range"] {
            width: 70%;
            margin-top: 20px;
        }

        /* КНОПКА ВНИЗУ */
        .btn {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);

            padding: 15px 40px;
            border: 2px solid #666;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            border-radius: 10px;
            background: transparent;
            transition: 0.3s;
        }

        .btn:hover {
            background: #666;
            color: black;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>SELECT YOUR BUDGET</h1>

    <input 
        type="range" 
        min="100" 
        max="10000" 
        value="1000" 
        step="100" 
        id="slider"
    >

    <div class="value" id="value">
        €1000
    </div>

</div>

<!-- КНОПКА (ТОЛЬКО ОНА ИЗМЕНЕНА) -->
<a href="#" class="btn" onclick="goNext()">Continue →</a>
<script>
    const slider = document.getElementById("slider");
    const value = document.getElementById("value");

    slider.oninput = function () {
        value.innerText = "€" + this.value;
    }
</script>

</body><script>
function goNext() {
  var budget = document.getElementById("slider").value;

  window.location.href = "results.html?budget=" + budget;
}
</script>
</html>
