<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PC Builder</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* твой фон */
            background: radial-gradient(circle at center, #000000 20%, #111111 40%, #ffffff 100%);
            color: white;

            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* Слайдер */
        input[type="range"] {
            width: 300px;
        }

        /* Контейнер кнопки */
        .btn-container {
            margin-top: 60px;
        }

        /* КНОПКА */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border: 2px solid #888;
            color: white;
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 2px;
            border-radius: 10px;
            transition: 0.3s;
            background: none;
        }

        .btn:hover {
            background: #888;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Choose your budget</h1>

    <!-- СЛАЙДЕР -->
    <input type="range" min="500" max="5000" value="1000">

    <!-- КНОПКА -->
    <div class="btn-container">
        <a href="#" class="btn">
            Continue →
        </a>
    </div>

</body>
</html>
