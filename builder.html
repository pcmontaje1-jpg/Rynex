<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rynex Builder</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    height: 100vh;
    background: radial-gradient(circle at center,
        #000000 50%,
        #050505 70%,
        #0f0f0f 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Контейнер */
.container {
    text-align: center;
    width: 80%;
}

/* Заголовок */
.title {
    font-size: 40px;
    margin-bottom: 50px;
    letter-spacing: 3px;
}

/* Значение бюджета */
.value {
    font-size: 30px;
    margin-bottom: 30px;
}

/* Слайдер */
.slider {
    width: 100%;
}

/* Кастом стиль */
input[type=range] {
    width: 100%;
    appearance: none;
    height: 6px;
    background: #333;
    border-radius: 5px;
    outline: none;
}

/* Ползунок */
input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    cursor: pointer;
}

/* Для Firefox */
input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">SELECT YOUR BUDGET</div>

    <div class="value" id="budgetValue">€1000</div>

    <input type="range" min="100" max="10000" value="1000" step="100"
           class="slider" id="budgetSlider">
</div><a href="next.html" class="btn">
    Continue →
</a>

<script>
const slider = document.getElementById("budgetSlider");
const output = document.getElementById("budgetValue");

slider.oninput = function() {
    output.innerHTML = "€" + this.value;
}
</script>

</body>
</html>
