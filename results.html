<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC Build Result</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e1e1e, #2c2c2c);
  color: white;
  text-align: center;
}

.container {
  margin-top: 80px;
}

.card {
  background: #2a2a2a;
  padding: 30px;
  border-radius: 12px;
  width: 350px;
  margin: auto;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

button {
  margin-top: 20px;
  padding: 12px 20px;
  background: #555;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #777;
}
</style>
</head>

<body>

<div class="container">
  <h1>Your Budget: <span id="budget"></span>€</h1>

  <div class="card" id="result"></div>

  <button onclick="goBack()">Back</button>
</div>

<script>
// ===== ПОЛУЧАЕМ ДАННЫЕ =====
const params = new URLSearchParams(window.location.search);
const clientBudget = parseInt(params.get("budget")) || 700;
const type = params.get("type") || "gaming";

document.getElementById("budget").innerText = clientBudget;

// ===== ПРИБЫЛЬ =====
let profit = 120;

if (clientBudget >= 900) profit = 150;
if (clientBudget <= 500) profit = 100;

const realBudget = clientBudget - profit;

// ===== СБОРКИ =====
function getPC(budget, type) {
  let pc = "";

  if (type === "gaming") {

    if (budget <= 400) {
      pc = `
Ryzen 5 3600
GTX 1660 Super
16GB RAM
500GB SSD
B450 Motherboard
500W PSU
      `;
    }

    else if (budget <= 550) {
      pc = `
Ryzen 5 5600
RX 6600
16GB RAM (2x8)
1TB SSD
B550 Motherboard
550W PSU
      `;
    }

    else if (budget <= 800) {
      pc = `
Ryzen 5 5600
RTX 3060
16GB RAM
1TB NVMe SSD
B550 Motherboard
600W PSU
      `;
    }

    else {
      pc = `
Ryzen 7 5800X
RTX 4060
32GB RAM
1TB NVMe SSD
B550/X570 Motherboard
650W PSU
      `;
    }

  } else {

    if (budget <= 400) {
      pc = `
Ryzen 5 5600G
16GB RAM
500GB SSD
      `;
    }

    else if (budget <= 700) {
      pc = `
Ryzen 7 5700G
16GB RAM
1TB SSD
      `;
    }

    else {
      pc = `
Intel i7 / Ryzen 7
32GB RAM
1TB NVMe SSD
      `;
    }
  }

  return pc;
}

// ===== ВЫВОД =====
function showResult() {
  const pc = getPC(realBudget, type);

  document.getElementById("result").innerHTML = `
    <h2>Your PC Build</h2>
    <p><b>Type:</b> ${type}</p>
    <pre>${pc}</pre>
  `;
}

function goBack() {
  window.history.back();
}

showResult();
</script>

</body>
</html>
