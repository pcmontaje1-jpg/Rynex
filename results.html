<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC Builder</title>
<style>
body{margin:0;height:100vh;font-family:Arial,sans-serif;color:#fff;text-align:center;background:radial-gradient(circle at center,#000 0%,#222 40%,#aaa 100%);display:flex;justify-content:center;align-items:center}
.container{animation:fadeIn 1s ease}
.btn{padding:15px 30px;margin:10px;border:none;border-radius:10px;background:#555;color:#fff;font-size:16px;cursor:pointer;transition:0.3s}
.btn:hover{background:#888;transform:scale(1.05)}
.card{margin-top:25px;background:rgba(0,0,0,0.9);padding:25px;border-radius:12px;display:inline-block;min-width:320px;animation:fadeInUp 0.6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="container">
  <h1>Your Budget: <span id="budget"></span>€</h1>
  <div id="choose">
    <button class="btn" onclick="buildPC('gaming')">🎮 Gaming</button>
    <button class="btn" onclick="buildPC('work')">💼 Work</button>
  </div>
  <div id="result"></div>
</div>

<script>
// ====== BUDGET ======
const params = new URLSearchParams(window.location.search);
const clientBudget = parseInt(params.get("budget")) || 700;
document.getElementById("budget").innerText = clientBudget;

// ====== PROFIT = +20-30€ EXTRA (BUFFER) ======
const profit = clientBudget + 20 + Math.floor(Math.random() * 10);
const realBudget = clientBudget; // клиент платит реальную цену

// ====== REAL COMPONENTS 2026 (PRICES MATCH BUDGET) ======
function getBuild(budget, type) {
  if (type === "gaming") {
    if (budget <= 400) return {
      cpu:'AMD Ryzen 5 5600', mobo:'MSI B550M PRO-VDH',
      ram:'Kingston 16GB DDR4 3200MHz',
      gpu:'XFX Radeon RX 6600 8GB',
      storage:'Kingston 500GB NVMe SSD',
      psu:'Corsair CV550 550W 80+ Bronze',
      cooler:'AMD Wraith Stealth'
    };
    if (budget <= 600) return {
      cpu:'AMD Ryzen 5 5600X', mobo:'ASUS TUF B550M-PLUS',
      ram:'Corsair 16GB DDR4 3600MHz',
      gpu:'PowerColor Radeon RX 6600 XT 8GB',
      storage:'Samsung 970 EVO 500GB NVMe',
      psu:'Corsair CV650 650W 80+ Bronze',
      cooler:'AMD Wraith Spire'
    };
    if (budget <= 800) return {
      cpu:'AMD Ryzen 5 7600', mobo:'ASUS TUF B650M-PLUS',
      ram:'G.Skill 32GB DDR5 5600MHz',
      gpu:'Sapphire Radeon RX 7600 XT 16GB',
      storage:'Samsung 980 PRO 1TB NVMe Gen4',
      psu:'be quiet! Pure Power 12M 750W 80+ Gold',
      cooler:'Deepcool AK400'
    };
    if (budget <= 1100) return {
      cpu:'AMD Ryzen 7 7700X', mobo:'ASUS ROG STRIX B650E-F',
      ram:'G.Skill 32GB DDR5 6000MHz',
      gpu:'Sapphire Radeon RX 7800 XT 16GB',
      storage:'WD Black SN850X 2TB NVMe Gen4',
      psu:'Corsair RM850x 850W 80+ Gold',
      cooler:'Deepcool AK620'
    };
    if (budget <= 1500) return {
      cpu:'AMD Ryzen 7 7800X3D', mobo:'ASUS ROG STRIX X670E-F',
      ram:'G.Skill 32GB DDR5 6000MHz CL30',
      gpu:'ASUS TUF RTX 4070 SUPER 12GB',
      storage:'Samsung 990 PRO 2TB NVMe Gen4',
      psu:'Corsair RM850e 850W 80+ Gold',
      cooler:'NZXT Kraken 240mm AIO'
    };
    if (budget <= 2000) return {
      cpu:'AMD Ryzen 7 9800X3D', mobo:'ASUS ROG CROSSHAIR X670E HERO',
      ram:'G.Skill 64GB DDR5 6400MHz',
      gpu:'ASUS ROG Strix RTX 5080 16GB',
      storage:'Samsung 990 PRO 4TB NVMe Gen4',
      psu:'Corsair HX1200 1200W 80+ Platinum',
      cooler:'NZXT Kraken X73 360mm AIO'
    };
    return {
      cpu:'AMD Ryzen 9 9950X3D', mobo:'ASUS ROG CROSSHAIR X870E HERO',
      ram:'G.Skill 128GB DDR5 8000MHz',
      gpu:'ASUS ROG Strix RTX 5090 32GB',
      storage:'Samsung 990 PRO 8TB NVMe Gen5',
      psu:'Corsair AX1600i 1600W 80+ Titanium',
      cooler:'Arctic Liquid Freezer III 420mm'
    };
  } else {
    if (budget <= 400) return {
      cpu:'AMD Ryzen 5 5600G', mobo:'Gigabyte B550M DS3H',
      ram:'Kingston 16GB DDR4 3200MHz',
      gpu:'Integrated Radeon Graphics',
      storage:'Kingston 500GB NVMe SSD',
      psu:'be quiet! 500W 80+ Bronze',
      cooler:'AMD Wraith Stealth'
    };
    if (budget <= 600) return {
      cpu:'AMD Ryzen 7 5700G', mobo:'MSI B550 TOMAHAWK',
      ram:'Corsair 32GB DDR4 3600MHz',
      gpu:'Integrated Radeon Graphics',
      storage:'Samsung 970 EVO 1TB NVMe',
      psu:'Corsair RM650 650W 80+ Gold',
      cooler:'AMD Wraith Prism'
    };
    if (budget <= 800) return {
      cpu:'AMD Ryzen 7 5700X', mobo:'ASUS TUF B550-PLUS',
      ram:'Corsair 32GB DDR4 3600MHz',
      gpu:'NVIDIA T400 4GB (Workstation)',
      storage:'Samsung 980 PRO 1TB NVMe Gen4',
      psu:'Corsair RM750e 750W 80+ Gold',
      cooler:'Deepcool AK400'
    };
    if (budget <= 1100) return {
      cpu:'AMD Ryzen 9 7900', mobo:'ASUS ProArt B650-CREATOR',
      ram:'Corsair 64GB DDR5 5600MHz',
      gpu:'NVIDIA RTX 4060 8GB (CUDA)',
      storage:'WD Black SN850X 2TB NVMe Gen4',
      psu:'Seasonic FOCUS GX-850 850W 80+ Gold',
      cooler:'Noctua NH-D15'
    };
    if (budget <= 1500) return {
      cpu:'AMD Ryzen 9 7900X', mobo:'ASUS ProArt X670E-CREATOR',
      ram:'Kingston 64GB DDR5 6000MHz',
      gpu:'NVIDIA RTX 4070 12GB (CUDA)',
      storage:'Samsung 990 PRO 2TB NVMe Gen4',
      psu:'be quiet! Dark Power 13 850W 80+ Titanium',
      cooler:'Arctic Liquid Freezer II 280mm'
    };
    if (budget <= 2000) return {
      cpu:'AMD Ryzen 9 9950X', mobo:'ASUS ProArt X670E-CREATOR WIFI',
      ram:'Kingston 128GB DDR5 5600MHz ECC',
      gpu:'NVIDIA RTX 4070 Ti SUPER 16GB',
      storage:'Samsung 990 PRO 4TB NVMe Gen4',
      psu:'be quiet! Dark Power 13 1000W 80+ Titanium',
      cooler:'Arctic Liquid Freezer III 360mm'
    };
    return {
      cpu:'AMD Ryzen 9 9950X3D', mobo:'ASUS ProArt X870E-CREATOR',
      ram:'Kingston 256GB DDR5 6400MHz ECC',
      gpu:'NVIDIA RTX 5090 32GB (Workstation)',
      storage:'Samsung 990 PRO 8TB NVMe Gen5',
      psu:'Corsair HX1500i 1500W 80+ Platinum',
      cooler:'Arctic Liquid Freezer III 420mm'
    };
  }
}

// ====== SHOW ======
function buildPC(type) {
  const b = getBuild(clientBudget, type);
  document.getElementById("choose").style.display = "none";
  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>${type==='gaming'?'🎮 Gaming PC':'💼 Work PC'}</h2>
      <p><b>CPU:</b> ${b.cpu}</p>
      <p><b>Motherboard:</b> ${b.mobo}</p>
      <p><b>RAM:</b> ${b.ram}</p>
      <p><b>GPU:</b> ${b.gpu}</p>
      <p><b>Storage:</b> ${b.storage}</p>
      <p><b>PSU:</b> ${b.psu}</p>
      <p><b>Cooler:</b> ${b.cooler}</p>
      <hr style="margin:15px 0;border-color:#333;">
      <p><b>💰 Price:</b> ${clientBudget}€</p>
      <p><b>💎 Profit (buffer):</b> +${profit - clientBudget}€</p>
      <button class="btn" onclick="buy()">🛒 Buy Now</button>
    </div>
  `;
}

function buy(){}
</script>

</body>
</html>

</body>
