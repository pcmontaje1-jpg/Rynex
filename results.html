<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC Builder</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;

  background: radial-gradient(circle at center, black 0%, #222 40%, #ccc 100%);

  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
}

.btn {
  padding: 15px 30px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #555;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.btn:hover {
  background: #777;
}

.card {
  margin-top: 25px;
  background: rgba(0,0,0,0.85);
  padding: 25px;
  border-radius: 12px;
  display: inline-block;
  min-width: 300px;
}

/* 🔥 КНОПКА BUY */
.buy-btn {
  margin-top: 15px;
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

.buy-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(34,197,94,0.6);
}
</style>
</head>

<body>

<div class="container">

  <h1>Your Budget: <span id="budget"></span>€</h1>

  <div id="choose">
    <button class="btn" onclick="buildPC('gaming')">🎮 Game</button>
    <button class="btn" onclick="buildPC('work')">💼 Work</button>
  </div>

  <div id="result"></div>

</div>

<script>
// бюджет
const params = new URLSearchParams(window.location.search);
const clientBudget = parseInt(params.get("budget")) || 1000;

document.getElementById("budget").innerText = clientBudget;

// 📈 ЛОГИКА ПРИБЫЛИ
let profit = 150;

if (clientBudget > 1500) profit = 220;
if (clientBudget > 2500) profit = 300;
if (clientBudget > 4000) profit = 450;

const realBudget = clientBudget - profit;

// СБОРКИ
function getBuild(budget, type) {

  if (type === "gaming") {

    if (budget <= 600) return `
Ryzen 5 5500<br>
RX 6600<br>
16GB RAM<br>
1TB NVMe`;

    if (budget <= 900) return `
Ryzen 5 5600<br>
RTX 3060<br>
16GB RAM<br>
1TB NVMe`;

    if (budget <= 1300) return `
Ryzen 5 7600<br>
RTX 4060<br>
32GB DDR5<br>
1TB NVMe`;

    if (budget <= 1800) return `
Ryzen 7 7700<br>
RTX 4070<br>
32GB DDR5<br>
2TB NVMe`;

    if (budget <= 2500) return `
Ryzen 7 7800X3D<br>
RTX 4070 Ti Super<br>
32GB DDR5<br>
2TB NVMe`;

    if (budget <= 3500) return `
Ryzen 9 7900X<br>
RTX 4080 Super<br>
64GB DDR5<br>
2TB NVMe`;

    return `
Ryzen 9 7950X3D<br>
RTX 4090<br>
64GB DDR5<br>
4TB NVMe`;
  }

  // WORK
  else {

    if (budget <= 600) return `
Ryzen 5 5600G<br>
16GB RAM<br>
1TB SSD`;

    if (budget <= 900) return `
Ryzen 5 7600<br>
32GB DDR5<br>
1TB NVMe`;

    if (budget <= 1300) return `
Ryzen 7 7700<br>
32GB DDR5<br>
1TB NVMe`;

    if (budget <= 1800) return `
Ryzen 7 7800X<br>
64GB DDR5<br>
2TB NVMe`;

    if (budget <= 2500) return `
Ryzen 9 7900<br>
64GB DDR5<br>
2TB NVMe`;

    if (budget <= 3500) return `
Ryzen 9 7950X<br>
96GB DDR5<br>
2TB NVMe`;

    return `
Ryzen 9 7950X3D<br>
128GB DDR5<br>
4TB NVMe`;
  }
}

// выбор
function buildPC(type) {

  const build = getBuild(realBudget, type);

  document.getElementById("choose").style.display = "none";

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>${type === 'gaming' ? 'Gaming PC' : 'Work PC'}</h2>
      <p>${build}</p>
      <p><b>Price:</b> ${clientBudget}€</p>
      <button class="buy-btn" onclick="buy()">🛒 Buy Now!</button>
    </div>
  `;
}

function buy() {
  window.location.href = "buy.html";
}
</script>

</body>
</html></script>

</body>
</html>
</script>
