<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PC Builder PRO</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.container {
    margin-top: 30px;
}

button {
    padding: 15px 25px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

.gaming {
    background: #ff4d4d;
    color: white;
}

.work {
    background: #4da6ff;
    color: white;
}

.build {
    margin-top: 30px;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    display: none;
    animation: fadeIn 0.5s ease forwards;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}

.part {
    margin: 5px 0;
}

.profit {
    margin-top: 10px;
    font-size: 20px;
    color: #00ffcc;
}
</style>
</head>

<body>

<h1>🔥 PC Builder PRO</h1>

<div class="container">
    <button class="gaming" onclick="showBuild('gaming')">🎮 Gaming</button>
    <button class="work" onclick="showBuild('work')">💼 Рабочий</button>
</div>

<div id="build" class="build"></div>

<script>

const builds = {
    gaming: [
        {
            name: "Gaming Build #1",
            cpu: "Ryzen 5 5600",
            gpu: "RTX 3060",
            ram: "16GB DDR4",
            ssd: "1TB NVMe",
            psu: "600W Bronze",
            motherboard: "B550",
            profit: "220€"
        },
        {
            name: "Gaming Build #2",
            cpu: "i5-12400F",
            gpu: "RTX 4060",
            ram: "16GB DDR4",
            ssd: "1TB NVMe",
            psu: "650W Gold",
            motherboard: "B660",
            profit: "270€"
        }
    ],

    work: [
        {
            name: "Work Build #1",
            cpu: "Ryzen 7 5700X",
            gpu: "RTX 3060",
            ram: "32GB DDR4",
            ssd: "1TB NVMe",
            psu: "650W",
            motherboard: "B550",
            profit: "240€"
        },
        {
            name: "Work Build #2",
            cpu: "i7-12700",
            gpu: "RTX 4060",
            ram: "32GB DDR5",
            ssd: "2TB NVMe",
            psu: "750W Gold",
            motherboard: "B760",
            profit: "300€"
        }
    ]
};

function showBuild(type) {
    const container = document.getElementById("build");

    // очищаем
    container.innerHTML = "";
    container.style.display = "block";

    builds[type].forEach((pc, index) => {
        const div = document.createElement("div");

        div.innerHTML = `
            <h2>${pc.name}</h2>
            <div class="part">🧠 CPU: ${pc.cpu}</div>
            <div class="part">🎮 GPU: ${pc.gpu}</div>
            <div class="part">⚡ RAM: ${pc.ram}</div>
            <div class="part">💾 SSD: ${pc.ssd}</div>
            <div class="part">🔌 PSU: ${pc.psu}</div>
            <div class="part">🧩 Motherboard: ${pc.motherboard}</div>
            <div class="profit">💰 Выручка: ${pc.profit}</div>
            <hr>
        `;

        div.style.animation = "fadeIn 0.5s ease";

        container.appendChild(div);
    });
}

</script>

</body>
