<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC Builder</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;

  background: radial-gradient(circle at center, black 0%, #222 40%, #ccc 100%);

  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
}

.btn {
  padding: 15px 30px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #555;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: .3s;
}

.btn:hover {
  background: #777;
  transform: scale(1.05);
}

.card {
  margin-top: 25px;
  background: rgba(0,0,0,.85);
  padding: 25px;
  border-radius: 12px;
  display: inline-block;
  min-width: 320px;
  box-shadow: 0 0 20px rgba(0,0,0,.5);
}

.card h2 {
  margin-top: 0;
  color: #00c8ff;
}

.card p {
  line-height: 1.8;
  font-size: 17px;
}
</style>

</head>
<body>

<div class="container">

<h1>Your Budget: <span id="budget"></span>€</h1>

<div id="choose">
    <button class="btn" onclick="buildPC('gaming')">🎮 Gaming</button>
    <button class="btn" onclick="buildPC('work')">💼 Work</button>
</div>

<div id="result"></div>

</div>

<script>
// получаем бюджет из ссылки
const params = new URLSearchParams(window.location.search);
const clientBudget = parseInt(params.get("budget")) || 700;

document.getElementById("budget").innerText = clientBudget;

// прибыль
let profit = 100;
if (clientBudget >= 800) profit = 150;

const realBudget = clientBudget - profit;

// сборки
function getBuild(budget, type) {

  if (type === "gaming") {

    if (budget <= 400) return `
AMD Ryzen 5 2600<br>
GTX 1650 4GB<br>
16GB DDR4<br>
A320 Motherboard<br>
480GB SSD<br>
500W Bronze PSU<br>
Aerocool Bolt`;

    if (budget <= 700) return `
AMD Ryzen 5 5600<br>
RX 6600 8GB<br>
16GB DDR4 3600MHz<br>
B550 Motherboard<br>
1TB NVMe SSD<br>
650W Bronze PSU<br>
Deepcool Matrexx 55`;

    if (budget <= 1000) return `
AMD Ryzen 5 7500F<br>
RTX 4060 8GB<br>
32GB DDR5 6000MHz<br>
B650 Motherboard<br>
1TB Gen4 NVMe SSD<br>
650W Gold PSU<br>
NZXT H5 Flow`;

    if (budget <= 1300) return `
AMD Ryzen 7 7700<br>
RTX 4070 12GB<br>
32GB DDR5 6000MHz<br>
B650 Motherboard<br>
2TB Gen4 NVMe SSD<br>
750W Gold PSU<br>
Lian Li Lancool 216`;

    return `
AMD Ryzen 7 7800X3D<br>
RTX 5070 12GB<br>
32GB DDR5 6400MHz<br>
X670 Motherboard<br>
2TB Samsung 990 Pro<br>
850W Gold PSU<br>
Corsair 4000D Airflow`;
  }

  // WORK PC

  if (budget <= 400) return `
AMD Ryzen 3 4100<br>
16GB DDR4<br>
A520 Motherboard<br>
500GB SSD<br>
500W PSU<br>
Zalman S2`;

  if (budget <= 700) return `
AMD Ryzen 5 5600G<br>
32GB DDR4<br>
B550 Motherboard<br>
1TB NVMe SSD<br>
600W Bronze PSU<br>
Fractal Focus G`;

  if (budget <= 1000) return `
AMD Ryzen 7 5700G<br>
32GB DDR4<br>
B550 Motherboard<br>
1TB Gen4 NVMe SSD<br>
650W Gold PSU<br>
be quiet! Pure Base 500`;

  if (budget <= 1300) return `
AMD Ryzen 7 7700<br>
64GB DDR5<br>
B650 Motherboard<br>
2TB Gen4 NVMe SSD<br>
750W Gold PSU<br>
Fractal Design North`;

  return `
AMD Ryzen 9 7900<br>
64GB DDR5 6400MHz<br>
X670 Motherboard<br>
2TB Samsung 990 Pro<br>
850W Gold PSU<br>
NZXT H7 Flow`;
}

// выбор типа
function buildPC(type) {

  const build = getBuild(realBudget, type);

  document.getElementById("choose").style.display = "none";

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>${type === "gaming" ? "🎮 Gaming PC" : "💼 Work PC"}</h2>

      <p>${build}</p>

      <p><b>Price:</b> ${clientBudget}€</p>

      <button class="btn" onclick="buy()">🛒 Buy Now</button>
    </div>
  `;
}

// кнопка покупки
function buy() {
  window.location.href = "buy.html";
}
</script>

</body>
</html>
</script>

</body>
</html>
</script>

</body>
</html>
</script>
