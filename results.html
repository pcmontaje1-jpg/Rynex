<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Results</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: linear-gradient(to right, white, black, white);
}

.container {
  text-align: center;
  margin-top: 100px;
}

.box {
  background: rgba(0,0,0,0.9);
  display: inline-block;
  padding: 40px;
  border-radius: 15px;
  width: 350px;
}

.btn {
  display: block;
  margin: 10px auto;
  padding: 12px;
  background: #333;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.btn:hover {
  background: #555;
}

.pc {
  margin-top: 20px;
  text-align: left;
}
</style>

</head>
<body>

<div class="container">
  <div class="box">

    <h2>Your Budget</h2>
    <p id="budgetText">Loading...</p>

    <div class="btn" onclick="choose('gaming')">Gaming 🎮</div>
    <div class="btn" onclick="choose('work')">Work 💼</div>

    <div id="results"></div>

  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const budget = parseInt(params.get("budget")) || 0;

// показываем бюджет ВСЕГДА
document.getElementById("budgetText").innerText = budget + " €";

<script>
function generateBuild() {

    let budget = parseInt(document.querySelector('input[name="budget"]').value);
    let type = document.querySelector('select[name="type"]').value;

    // ===== ПРОВЕРКА БЮДЖЕТА =====
    if (isNaN(budget)) {
        alert("Enter your budget");
        return;
    }

    if (budget < 100) {
        alert("Minimum budget is 100€");
        return;
    }

    if (budget > 10000) {
        alert("Maximum budget is 10,000€");
        return;
    }

    // ===== ЛОГИКА ПРИБЫЛИ =====
    let profit = 100;
    let realBudget = budget - profit;

    let result = "";

    // ===== GAMING PC =====
    if (type === "Gaming") {

        if (realBudget <= 300) {
            result = `
            <h2>Gaming PC (${budget}€)</h2>
            <p>CPU: Ryzen 5 3600</p>
            <p>GPU: GTX 1660</p>
            <p>RAM: 16GB DDR4</p>
            <p>Storage: 500GB SSD</p>
            <p>Motherboard: B450</p>
            <p>PSU: 500W</p>
            <p>Case: Basic Case</p>
            `;
        } else if (realBudget <= 800) {
            result = `
            <h2>Gaming PC (${budget}€)</h2>
            <p>CPU: Ryzen 5 5600</p>
            <p>GPU: RTX 3060</p>
            <p>RAM: 16GB DDR4</p>
            <p>Storage: 1TB SSD</p>
            <p>Motherboard: B550</p>
            <p>PSU: 600W</p>
            <p>Case: Gaming Case</p>
            `;
        } else {
            result = `
            <h2>Gaming PC (${budget}€)</h2>
            <p>CPU: Ryzen 7 / Ryzen 9</p>
            <p>GPU: RTX 4070+</p>
            <p>RAM: 32GB DDR4/DDR5</p>
            <p>Storage: 2TB SSD</p>
            <p>Motherboard: X570 / B650</p>
            <p>PSU: 750W+</p>
            <p>Case: Premium Case</p>
            `;
        }

    // ===== WORK PC =====
    } else {

        if (realBudget <= 300) {
            result = `
            <h2>Work PC (${budget}€)</h2>
            <p>CPU: Intel i5</p>
            <p>GPU: Integrated</p>
            <p>RAM: 8GB DDR4</p>
            <p>Storage: 256GB SSD</p>
            <p>Motherboard: H410</p>
            <p>PSU: 400W</p>
            <p>Case: Office Case</p>
            `;
        } else if (realBudget <= 800) {
            result = `
            <h2>Work PC (${budget}€)</h2>
            <p>CPU: Intel i7</p>
            <p>GPU: Integrated / GTX 1650</p>
            <p>RAM: 16GB DDR4</p>
            <p>Storage: 512GB SSD</p>
            <p>Motherboard: B460</p>
            <p>PSU: 500W</p>
            <p>Case: Office Case</p>
            `;
        } else {
            result = `
            <h2>Work PC (${budget}€)</h2>
            <p>CPU: Intel i9 / Ryzen 9</p>
            <p>GPU: RTX 3060+</p>
            <p>RAM: 32GB+</p>
            <p>Storage: 1TB+ SSD</p>
            <p>Motherboard: High-end</p>
            <p>PSU: 650W+</p>
            <p>Case: Premium Office Case</p>
            `;
        }
    }

    document.getElementById("result").innerHTML = result;
}
</script>
    }

  }

  
}
</script>
<a href="buy.html" class="buy-button">BUY</a>

<style>
.buy-button {
    display: block;
    width: 180px;
    margin: 40px auto;
    padding: 15px;

    background: #777;
    color: white;

    text-align: center;
    text-decoration: none;

    border-radius: 10px;

    font-size: 22px;
    font-weight: bold;
}
</style>
</body>
</html>
