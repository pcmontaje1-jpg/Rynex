<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Results</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;

  /* твой фон */
  background: linear-gradient(to right, white, black, white);
}

.container {
  text-align: center;
  margin-top: 150px;
}

.box {
  background: rgba(0,0,0,0.8);
  display: inline-block;
  padding: 40px;
  border-radius: 15px;
}

h1 {
  margin-bottom: 20px;
}

.btn {
  display: block;
  margin: 15px auto;
  padding: 12px 25px;
  background: #333;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  width: 200px;
  transition: 0.2s;
}

.btn:hover {
  background: #555;
}
</style>

</head>
<body>

<div class="container">
  <div class="box">

    <h1>Your Budget</h1>
    <p id="text"></p>

    <!-- КНОПКИ -->
    <a href="#" class="btn" onclick="choose('gaming')">Gaming PC 🎮</a>
    <a href="#" class="btn" onclick="choose('work')">Work / Office 💼</a>

  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var budget = params.get("budget");

document.getElementById("text").innerText = budget + " €";
<script>
var params = new URLSearchParams(window.location.search);
var budget = parseInt(params.get("budget"));

document.getElementById("text").innerText = budget + " €";

function choose(type) {
  const box = document.querySelector(".box");

  let content = "<h2>Best options for you:</h2>";

  if (type === "gaming") {

    if (budget < 1000) {
      content += "<p>🔹 Basic Gaming PC<br>GTX 1650 / Ryzen 5</p>";
    } 
    else if (budget < 3000) {
      content += "<p>🔥 Mid Gaming PC<br>RTX 3060 / Ryzen 7</p>";
    } 
    else {
      content += "<p>🚀 High-End Gaming PC<br>RTX 4090 / i9</p>";
    }

  } else {

    if (budget < 1000) {
      content += "<p>💼 Office PC<br>i3 / 8GB RAM</p>";
    } 
    else if (budget < 3000) {
      content += "<p>💻 Workstation<br>i7 / 16GB RAM</p>";
    } 
    else {
      content += "<p>🧠 Pro Workstation<br>i9 / 32GB RAM</p>";
    }

  }

  box.innerHTML = content;
}
</script>


  // дальше можно сделать переход:
  // window.location.href = "final.html?budget=" + budget + "&type=" + type;
}
</script>

</body>
</html>
