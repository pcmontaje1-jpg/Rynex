}

.container {
  max-width: 1300px;
  margin: 0 auto;
}

.header {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 30px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
}

.header h1 {
  font-size: 2.8rem;
  font-weight: 300;
  letter-spacing: 2px;
}

.header .budget {
  font-size: 4.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: pulse 2s infinite;
}

.header .sub {
  font-size: 1.2rem;
  color: #aaa;
}

.profit-block {
  background: rgba(0,0,0,0.7);
  border-radius: 15px;

  margin-bottom: 30px;
  border: 1px solid rgba(255,215,0,0.15);
}

.profit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  margin-bottom: 15px;
}

.profit-item {
  text-align: center;
}

.profit-label {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #aaa;
  margin-bottom: 5px;
}

.profit-value {
  font-size: 2.2rem;
  font-weight: 700;
  transition: all 0.3s;
}

.profit-value.green { color: #4caf50; }
.profit-value.gold { color: #ffd700; }
.profit-value.red { color: #ff6b6b; }
.profit-value.purple { color: #a855f7; }

.profit-bar-track {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 5px;
  overflow: hidden;
  margin-top: 10px;
}

.profit-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4caf50, #ffd700, #ff6b6b, #a855f7);
  border-radius: 5px;
  transition: width 0.3s ease;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.btn {
  padding: 22px 30px;
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  color: white;
  font-size: 1.3rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(5px);
}

.btn:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,0.1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.btn-gaming { border-color: #e74c3c; }

.btn-premium { border-color: #a855f7; }

  margin-top: 20px;
}
