<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC Builder</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;

  background: radial-gradient(circle at center, black 0%, #333 50%, #ccc 100%);

  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
}

/* кнопки */
.btn {
  padding: 15px 30px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #555;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* hover */
.btn:hover {
  background: #777;
}

/* карточка */
.card {
  margin-top: 20px;
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 10px;
  display: inline-block;
  min-width: 300px;

  opacity: 0;
  animation: fadeIn 0.5s forwards;
}

/* простая анимация */
@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="container">

  <h1>💻 PC Builder</h1>

  <div id="choose">
    <p>Choose type:</p>
    <button class="btn" onclick="buildPC('gaming')">Gaming</button>
    <button class="btn" onclick="buildPC('work')">Work</button>
  </div>

  <div id="result"></div>

</div>

<script>

let clientBudget = 1000;
let realBudget = 800;

/* Ryzen сборки */
function getBuild(type) {

  const builds = [
`CPU: Ryzen 9 7950X
GPU: RTX 4090
RAM: 64GB DDR5
SSD: 2TB NVMe
PSU: 1000W Gold
Cooling: Liquid AIO`,

`CPU: Ryzen 9 7900X
GPU: RTX 4080
RAM: 32GB DDR5
SSD: 2TB NVMe
PSU: 850W Gold
Cooling: Liquid AIO`,

`CPU: Ryzen 7 7800X3D
GPU: RTX 4070 Ti
RAM: 32GB DDR5
SSD: 1TB NVMe
PSU: 750W Gold
Cooling: Air Premium`
  ];

  return builds[Math.floor(Math.random() * builds.length)];
}

/* кнопки теперь работают */
function buildPC(type) {

  const build = getBuild(type);
  const result = document.getElementById("result");

  document.getElementById("choose").style.display = "none";

  result.innerHTML = `
    <div class="card">
      <h2>${type === 'gaming' ? 'Gaming PC' : 'Work PC'}</h2>
      <pre style="text-align:left">${build}</pre>
      <p><b>Price:</b> ${clientBudget}€</p>
      <button class="btn" onclick="buy()">Buy</button>
    </div>
  `;
}

function buy() {
  alert("Sold!");

  clientBudget += Math.floor(Math.random() * 100 + 200);

  document.getElementById("result").innerHTML = "";
  document.getElementById("choose").style.display = "block";
}

</script>

</body>
