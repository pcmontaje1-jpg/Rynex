<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC Builder</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;

  /* ✅ ОДИН КРУГ */
  background: radial-gradient(circle at center, black 0%, #222 40%, #ccc 100%);

  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
}

/* КНОПКИ */
.btn {
  padding: 15px 30px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #555;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.btn:hover {
  background: #777;
}

/* КАРТОЧКА */
.card {
  margin-top: 25px;
  background: rgba(0,0,0,0.85);
  padding: 25px;
  border-radius: 12px;
  display: inline-block;
  min-width: 300px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Your Budget: <span id="budget"></span>€</h1>

  <!-- ВЫБОР -->
  <div id="choose">
    <button class="btn" onclick="buildPC('gaming')">🎮 Gaming</button>
    <button class="btn" onclick="buildPC('work')">💼 Work</button>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="result"></div>

</div>

<script>
// получаем бюджет из ссылки
const params = new URLSearchParams(window.location.search);
const clientBudget = parseInt(params.get("budget")) || 700;

document.getElementById("budget").innerText = clientBudget;

// прибыль
let profit = 100;
if (clientBudget >= 800) profit = 150;

const realBudget = clientBudget - profit;

// сборки
function getBuild(budget, type) {

  if (type === "gaming") {

    if (budget <= 400) return `
AMD Ryzen 5 3600<br>
GTX 1660 Super 6GB<br>
16GB DDR4 3200MHz<br>
B450 Motherboard<br>
500GB SSD<br>
550W Bronze PSU<br>
Deepcool Case`;

    if (budget <= 700) return `
Intel Core i5-12400F<br>
RTX 2060 6GB<br>

B660 Motherboard<br>
1TB NVMe SSD<br>
650W Bronze PSU<br>
Montech Air 100`;

    if (budget <= 1000) return `
AMD Ryzen 5 7500F<br>
RTX 4060 8GB<br>

1TB NVMe Gen4 SSD<br>
650W Gold PSU<br>

    return `

Z790 Motherboard<br>

Lian Li Lancool 216`;
  }

  // WORK PC

  if (budget <= 400) return `
AMD Ryzen 5 5600G<br>

A520 Motherboard<br>
500GB SSD<br>
500W PSU<br>
Silent Case`;

  if (budget <= 700) return `
Intel Core i5-13400<br>
32GB DDR4<br>
B760 Motherboard<br>
1TB NVMe SSD<br>
600W Bronze PSU<br>
Fractal Focus 2`;

  if (budget <= 1000) return `
AMD Ryzen 7 7700<br>
32GB DDR5<br>
B650 Motherboard<br>
1TB Gen4 NVMe SSD<br>
650W Gold PSU<br>
be quiet! Pure Base 500`;

  return `
Intel Core i7-13700<br>
64GB DDR5<br>
Z790 Motherboard<br>
2TB Gen4 NVMe SSD<br>
750W Gold PSU<br>
Fractal Design North`;
}
      <button class="btn" onclick="buy()">Buy</button>
    </div>
  `;
}

// кнопка покупки
function buy() {
  window.location.href = "buy.html";
}
</script>
