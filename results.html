<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PC Builder</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;

  /* ✅ ОДИН КРУГ */
  background: radial-gradient(circle at center, black 0%, #222 40%, #ccc 100%);

  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
}

/* КНОПКИ */
.btn {
  padding: 15px 30px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #555;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.btn:hover {
  background: #777;
}

/* КАРТОЧКА */
.card {
  margin-top: 25px;
  background: rgba(0,0,0,0.85);
  padding: 25px;
  border-radius: 12px;
  display: inline-block;
  min-width: 300px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Your Budget: <span id="budget"></span>€</h1>

  <!-- ВЫБОР -->
  <div id="choose">
    <button class="btn" onclick="buildPC('gaming')">🎮 Gaming</button>
    <button class="btn" onclick="buildPC('work')">💼 Work</button>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="result"></div>

</div>

<script>
// получаем бюджет из ссылки
const params = new URLSearchParams(window.location.search);
const clientBudget = parseInt(params.get("budget")) || 700;

document.getElementById("budget").innerText = clientBudget;

// прибыль
let profit = 100;
if (clientBudget >= 800) profit = 150;

const realBudget = clientBudget - profit;

// сборки
function getBuild(budget, type) {

  if (type === "gaming") {

    if (budget <= 400) return `
Ryzen 5 3600<br>
GTX 1660 Super<br>
16GB RAM<br>
500GB SSD`;

    if (budget <= 700) return `
Ryzen 5 5600<br>
RX 6600<br>
16GB RAM<br>
1TB SSD`;

    return `
Ryzen 5 5600<br>
RTX 3060<br>
16GB RAM<br>
1TB NVMe`;
  }

  // work
  else {

    if (budget <= 400) return `
Ryzen 5 5600G<br>
16GB RAM<br>
500GB SSD`;

    if (budget <= 700) return `
Ryzen 5 5600<br>
16GB RAM<br>
1TB SSD`;

    return `
Ryzen 7 5800X<br>
32GB RAM<br>
1TB NVMe`;
  }
}

// выбор типа
function buildPC(type) {

  const build = getBuild(realBudget, type);

  document.getElementById("choose").style.display = "none";

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>${type === 'gaming' ? 'Gaming PC' : 'Work PC'}</h2>
      <p>${build}</p>
      <p><b>Price:</b> ${clientBudget}€</p>
      <button class="btn" onclick="buy()">Buy</button>
    </div>
  `;
}

// кнопка покупки
function buy() {
  window.location.href = "buy.html";
}
</script>

</body>
</html>
</script>
