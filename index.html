<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rynex</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    height: 200vh;
    background: radial-gradient(circle at center,
        #000000 35%,
        #0a0a0a 55%,
        #ffffff 100%);
    color: white;
}

.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.subtitle {
    font-size: 14px;
    letter-spacing: 4px;
    opacity: 0.6;
    margin-bottom: 20px;
}

.title {
    font-size: 90px;
    letter-spacing: 10px;
    font-weight: 300;
}

.bottom-btn {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: #2b2b2b;
    padding: 18px 50px;
    border-radius: 10px;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
}

.bottom-btn:hover {
    background: #3a3a3a;
}

.arrow {
    font-size: 18px;
}
</style>
</head>
