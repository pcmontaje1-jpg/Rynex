<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainix</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 200vh; /* чтобы можно было скроллить */
        background: radial-gradient(circle at center,
            #000000 40%,
            #111111 55%,
            #ffffff 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .container {
        text-align: center;
    }

    h1 {
        font-size: 80px;
        letter-spacing: 8px;
        font-weight: 300;
    }

    .button {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        padding: 20px 60px;
        background: #2b2b2b;
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }

    .button:hover {
        background: #3a3a3a;
    }
</style>
</head>

<body>

<div class="container">
    <h1>RAINIX</h1>
</div>

<button class="button">Enter</button>

</body>
</html>
